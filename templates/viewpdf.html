<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View PDF</title>

        .pdf-container {
            width: 100%;
            height: 100vh;

</body>
</html>
